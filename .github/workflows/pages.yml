name: Deploy ADSolutions Digital Card to GitHub Pages
# Custom domain: card.adsolutionsglobal.com

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build contact vCard with portrait
        run: |
          python -m pip install --disable-pip-version-check --quiet pillow
          python scripts/build_contact_vcard.py

      - name: Prepare clean custom-domain route
        run: |
          rm -rf andreas
          cp -R card/andreas andreas
          sed -i 's#../../assets/#../assets/#g' andreas/index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
